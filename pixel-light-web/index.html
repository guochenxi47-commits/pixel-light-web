<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素画框</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header>
    <h1>像素画框</h1>
    <p>把喜欢的画面，变成桌上的一盏小灯</p>
  </header>

  <div class="resolution-note" aria-label="当前分辨率">统一分辨率：16 × 16</div>

  <section class="conn" aria-label="画框连接设置">
    <div class="conn-row">
      <label for="ip">画框 IP</label>
      <input id="ip" type="text" inputmode="decimal" placeholder="例如 192.168.1.50" autocomplete="off">
    </div>
    <label class="demo-row">
      <input type="checkbox" id="demo" checked>
      演示模式（不真的发送，只在控制台打印）
    </label>
  </section>

  <main class="frame">
    <canvas id="grid" role="img" aria-label="16乘16的像素画预览"></canvas>
  </main>

  <div class="actions">
    <button id="btn-upload">上传照片</button>
    <button id="btn-draw">手绘</button>
    <button id="btn-ai">AI 生成</button>
  </div>
  <button id="btn-send">发送到画框</button>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="ai" id="ai" hidden>
    <input type="text" id="ai-prompt" maxlength="60" placeholder="想画什么？例如：戴帽子的小猫" autocomplete="off">
    <div class="ai-row">
      <button id="ai-go">生成</button>
      <button id="ai-idea">随机灵感</button>
    </div>
    <label class="demo-row">
      画法
      <select id="ai-mode" style="flex:1;font:inherit;color:var(--text);background:var(--off);border:0;border-radius:10px;padding:8px 10px">
        <option value="svg">矢量图再转像素（推荐，形状更准）</option>
        <option value="grid">逐格直接画（不稳定）</option>
      </select>
    </label>
    <label class="demo-row">
      <input type="checkbox" id="ai-demo" checked>
      离线演示（不联网，用内置示例图测试流程）
    </label>
    <p class="hint">在线 AI 服务由网站统一提供，无需填写 API Key。离线演示可随时体验内置示例图案。</p>
  </div>

  <div class="paint" id="paint" hidden>
    <div id="palette" aria-label="常用颜色"></div>
    <div class="paint-row">
      <label id="custom-wrap" for="custom">自定义
        <input type="color" id="custom" value="#ff6fb5">
      </label>
      <button class="tool" id="btn-erase">橡皮擦</button>
      <button class="tool" id="btn-undo">撤销</button>
      <button class="tool" id="btn-clear">清空</button>
    </div>
  </div>

  <div class="controls" id="controls" hidden>
    <label for="colors"><span>颜色数量</span><span id="colorsVal">16</span></label>
    <input type="range" id="colors" min="4" max="32" value="16">
    <label for="contrast" style="margin-top:12px"><span>对比度（人像看不清时调高）</span><span id="contrastVal">0</span></label>
    <input type="range" id="contrast" min="0" max="100" value="0">
  </div>


  <section class="mood-panel" id="mood-panel" aria-labelledby="mood-title">
    <div class="mood-heading">
      <h2 id="mood-title">情绪创作</h2>
      <p>把此刻的心情，变成一束安静的光。</p>
    </div>
    <label class="mood-label" for="mood-prompt">说说你现在的感受</label>
    <textarea id="mood-prompt" maxlength="240" rows="3" placeholder="例如：今天有点累，想安静地休息一会儿。"></textarea>
    <label class="mood-label" for="mood-motion">动态效果</label>
    <select id="mood-motion">
      <option value="auto">交给 AI 决定</option>
      <option value="breathing">柔和呼吸</option>
      <option value="flow">缓慢流动</option>
      <option value="twinkle">微光闪烁</option>
      <option value="static">静态微光</option>
    </select>
    <button id="mood-generate" type="button">生成我的情绪灯</button>
    <div class="mood-preview-wrap">
      <canvas id="mood-preview" width="160" height="160" aria-label="16乘16情绪灯动态预览"></canvas>
      <p id="mood-status" role="status">输入心情，生成一幅专属的16×16像素灯画。</p>
    </div>
    <div class="mood-tools" id="mood-tools" hidden>
      <button id="mood-play" type="button">暂停</button>
      <label>速度 <input id="mood-speed" type="range" min="50" max="150" value="100"></label>
      <label>亮度 <input id="mood-brightness" type="range" min="10" max="60" value="38"></label>
      <button id="mood-apply" type="button">应用到主画布</button>
    </div>
    <p class="mood-note">动画在本地循环播放，不会持续调用 AI。实体灯连接功能将在硬件阶段接入。</p>
  </section>

  <p id="tip">点「上传照片」，选一张图试试</p>
  <p id="hexinfo"></p>

<script src="js/app.js" defer></script>
<script src="js/mood.js" defer></script>
</body>
</html>
